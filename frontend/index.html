<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Cloud Control</h1>
    <div class="topbar-actions" id="app-actions" hidden>
      <button id="refresh-btn" type="button">조회</button>
      <button id="logout-btn" type="button" class="secondary">로그아웃</button>
    </div>
  </header>

  <section id="login-view" class="login">
    <form id="login-form" class="panel" autocomplete="off" novalidate>
      <label for="token-input">관리자 토큰</label>
      <input id="token-input" type="password" autocomplete="off" spellcheck="false" required>
      <div id="login-status" class="status" hidden></div>
      <button id="connect-btn" type="submit">연결</button>
    </form>
  </section>

  <div id="app-view" hidden>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="dashboard" aria-selected="true">대시보드</button>
      <button type="button" role="tab" data-tab="ec2" aria-selected="false">EC2</button>
      <button type="button" role="tab" data-tab="s3" aria-selected="false">S3</button>
      <button type="button" role="tab" data-tab="sg" aria-selected="false">보안 그룹</button>
    </nav>

    <main>
      <section id="tab-dashboard" class="panel">
        <div id="context-status" class="status"></div>
        <dl class="context">
          <dt>계정</dt><dd id="ctx-account">-</dd>
          <dt>호출자 ARN</dt><dd id="ctx-arn">-</dd>
          <dt>리전</dt><dd id="ctx-region">-</dd>
          <dt>마지막 조회</dt><dd id="last-fetched">-</dd>
        </dl>
        <div class="cards">
          <div class="card"><span class="card-label">EC2 인스턴스</span><span id="count-ec2" class="card-value">-</span></div>
          <div class="card"><span class="card-label">S3 버킷</span><span id="count-s3" class="card-value">-</span></div>
          <div class="card"><span class="card-label">보안 그룹</span><span id="count-sg" class="card-value">-</span></div>
        </div>
      </section>

      <section id="tab-ec2" class="panel" hidden>
        <div id="ec2-status" class="status"></div>
        <div class="table-wrap">
          <table id="ec2-table" hidden>
            <thead>
              <tr><th>이름</th><th>인스턴스 ID</th><th>상태</th><th>유형</th><th>프라이빗 IP</th><th>퍼블릭 IP</th><th>제어 허용</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="tab-s3" class="panel" hidden>
        <div id="s3-status" class="status"></div>
        <div class="table-wrap">
          <table id="s3-table" hidden>
            <thead><tr><th>버킷 이름</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="tab-sg" class="panel" hidden>
        <div id="sg-status" class="status"></div>
        <div class="table-wrap">
          <table id="sg-table" hidden>
            <thead>
              <tr><th>그룹 ID</th><th>그룹 이름</th><th>프로토콜</th><th>포트</th><th>소스</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
